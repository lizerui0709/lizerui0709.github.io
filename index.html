<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 移动端视口核心适配：禁止缩放、占满屏幕、设置理想视口 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="format-detection" content="telephone=no">
    <title>Soul Nebula: 自由音乐版</title>
    <style>
        /* --- 基础设定 --- */
        body { 
            margin: 0; overflow: hidden; 
            background-color: #02020a; 
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; 
            user-select: none;
            cursor: grab; /* 拖动光标-桌面 */
            touch-action: none; /* 禁止浏览器默认触摸行为（滚动/缩放），核心！ */
        }
        body.dragging { cursor: grabbing; } /* 拖动中光标-桌面 */
        body.zoom-pause { cursor: default; } /* 放大停留时光标-桌面 */
        canvas { display: block; width: 100vw; height: 100vh; } /* 画布占满视口-移动端核心 */
        
        /* 原始视频源隐藏（直接删除也可，保留避免报错） */
        #input_video { display: none; }
        
        /* 隐藏的文件输入框 */
        #music-upload { display: none; }

        /* --- UI 容器 移动端自适应 --- */
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
            /* 移动端内边距自适应，替换固定30px为百分比+固定值 */
            padding: clamp(15px, 4vw, 30px); 
            box-sizing: border-box;
            z-index: 10;
            transition: opacity 0.5s;
        }

        /* 沉浸模式下隐藏 HUD */
        body.clean-mode #hud,
        body.clean-mode .lil-gui {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        h1 { 
            margin: 0; color: #fff; 
            /* 字体大小自适应：移动端小，桌面端大 */
            font-size: clamp(18px, 5vw, 24px); 
            font-weight: 300; 
            letter-spacing: clamp(3px, 1.5vw, 6px); 
            text-transform: uppercase; 
            text-shadow: 0 0 30px rgba(100, 150, 255, 0.6);
        }
        .sub-text { 
            /* 副标题字体/间距自适应 */
            font-size: clamp(12px, 3vw, 14px); 
            color: #b0cfff; margin-top: clamp(8px, 2vw, 12px); 
            letter-spacing: clamp(1px, 0.5vw, 2px); 
            opacity: 0.85; font-weight: 400;
            line-height: 1.5; /* 移动端增加行高，避免文字重叠 */
        }
        .highlight { color: #00ffea; font-weight: bold; margin: 0 2px; text-shadow: 0 0 10px #00ffea80;}

        /* 按钮组 移动端自适应 */
        .controls-row {
            margin-top: clamp(10px, 2.5vw, 15px);
            display: flex;
            gap: clamp(10px, 2.5vw, 15px);
            pointer-events: auto;
            flex-wrap: wrap; /* 移动端屏幕窄时按钮自动换行 */
        }

        .hud-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            /* 按钮内边距/字体自适应 */
            padding: clamp(6px, 2vw, 8px) clamp(12px, 3vw, 16px);
            cursor: pointer;
            font-size: clamp(10px, 2.2vw, 12px);
            letter-spacing: clamp(1px, 0.5vw, 2px);
            transition: 0.3s;
            text-transform: uppercase;
            backdrop-filter: blur(5px);
            border-radius: 4px; /* 移动端增加圆角，更贴合设计 */
            flex-shrink: 0; /* 防止按钮被挤压 */
        }
        .hud-btn:hover, .hud-btn.touch-hover { 
            background: rgba(0, 255, 234, 0.2); 
            border-color: #00ffea; 
            color: #00ffea; 
        }
        
        /* 音乐播放时的状态 */
        .hud-btn.playing {
            border-color: #00ffea;
            box-shadow: 0 0 10px rgba(0, 255, 234, 0.3);
            color: #00ffea;
        }

        /* 移除摄像头相关的状态指示器（直接隐藏） */
        #hand-status { display: none !important; }

        /* 进度条 移动端居中自适应 */
        #dissolve-bar-container {
            position: absolute; 
            bottom: clamp(80px, 15vw, 120px); /* 移动端上移进度条，避免被遮挡 */
            left: 50%; transform: translateX(-50%);
            width: clamp(150px, 40vw, 200px); /* 宽度自适应 */
            height: 4px; background: rgba(255,255,255,0.1);
            border-radius: 2px; overflow: hidden; opacity: 0; transition: opacity 0.3s;
            z-index: 11;
        }
        #dissolve-bar {
            width: 0%; height: 100%; background: #00ffea; 
            box-shadow: 0 0 10px #00ffea;
        }

        /* 移除自定义手势光标（直接隐藏） */
        #cursor { display: none !important; }

        /* 加载层 移动端适配 */
        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #02020a; z-index: 999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #fff; 
            letter-spacing: clamp(4px, 2vw, 8px); 
            font-size: clamp(14px, 3.5vw, 16px); 
            font-weight: 300;
            transition: opacity 1.5s ease-out;
            pointer-events: auto; 
            cursor: pointer;
            touch-action: none;
        }
        #loading-overlay span {
            margin-top: clamp(15px, 4vw, 20px); 
            font-size: clamp(10px, 2.5vw, 12px); 
            opacity: 0.6; 
            letter-spacing: clamp(1px, 0.5vw, 2px);
        }

        /* --- 文本编辑器 Modal 移动端全屏适配 --- */
        #editor-modal {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            justify-content: center; align-items: flex-start; /* 移动端上对齐，避免键盘遮挡 */
            padding-top: clamp(20px, 5vw, 30px);
            backdrop-filter: blur(10px);
            pointer-events: auto;
            overflow-y: auto; /* 移动端允许滚动 */
        }
        #editor-container {
            width: clamp(280px, 90%, 600px); /* 最大600px，最小280px，适配小屏手机 */
            background: #111; border: 1px solid #333;
            padding: clamp(20px, 5vw, 30px); 
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            border-radius: 8px; /* 移动端增加圆角 */
            margin: 0 auto;
        }
        #editor-container h2 { 
            color: #fff; margin-top: 0; font-weight: 300; 
            letter-spacing: clamp(2px, 1vw, 4px); 
            font-size: clamp(16px, 4vw, 20px);
        }
        #text-input {
            width: 100%; 
            height: clamp(200px, 40vh, 300px); /* 高度适配，占屏幕40%最大 */
            background: #050505; border: 1px solid #333;
            color: #ccc; padding: clamp(10px, 2.5vw, 15px);
            font-family: monospace; 
            font-size: clamp(12px, 3vw, 14px); 
            line-height: 1.5;
            resize: vertical; box-sizing: border-box;
            border-radius: 4px;
        }
        .btn-group { 
            margin-top: clamp(15px, 4vw, 20px); 
            display: flex; justify-content: flex-end; gap: clamp(8px, 2vw, 10px); 
        }
        .modal-btn {
            /* 弹窗按钮适配 */
            padding: clamp(8px, 2.5vw, 10px) clamp(20px, 5vw, 25px); 
            border: none; cursor: pointer;
            font-weight: bold; letter-spacing: 1px;
            border-radius: 4px;
            font-size: clamp(12px, 3vw, 14px);
        }
        .btn-save { background: #00ffea; color: #000; }
        .btn-cancel { background: transparent; color: #fff; border: 1px solid #555; }

        /* 移除摄像头预览窗口（直接隐藏） */
        #camera-preview-container { display: none !important; }

        @keyframes fadeIn { from { opacity: 0; transform: scaleX(-1) translateY(20px); } to { opacity: 1; transform: scaleX(-1) translateY(0); } }

        /* lil-gui 移动端自适应宽度 */
        .lil-gui { --width: clamp(220px, 60vw, 280px); transition: opacity 0.5s; }
    </style>
</head>
<body>

    <video id="input_video"></video>
    <div id="cursor"></div>
    
    <input type="file" id="music-upload" accept="audio/*">

    <div id="loading-overlay" onclick="startExperience()" ontouchstart="startExperience()">
        <div>点击/触摸任意处启动系统</div>
        <span>初始化音效引擎...</span>
    </div>

    <div id="editor-modal">
        <div id="editor-container">
            <p style="color:#888; font-size:clamp(10px,2.5vw,12px); margin-bottom:10px;">每行一段文字，星云将随机抽取生成。</p>
            <textarea id="text-input"></textarea>
            <div class="btn-group">
                <button class="modal-btn btn-cancel" onclick="closeEditor()" ontouchstart="closeEditor()">取消</button>
                <button class="modal-btn btn-save" onclick="saveText()" ontouchstart="saveText()">保存并重组</button>
            </div>
        </div>
    </div>

    <div id="hud">
        <div class="top-bar">
            <div>
                <h1>lizerui</h1>
                <div class="sub-text">
                    luo<span class="highlight">x</span>yu/  <span class="highlight">技术</span>  /  <span class="highlight">不够</span>还请见谅  / 
                </div>
                <div class="controls-row">
            </div>
            <div style="width: clamp(100px, 25vw, 200px);"></div> <!-- 占位符自适应 -->
        </div>
        <div id="dissolve-bar-container"><div id="dissolve-bar"></div></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import GUI from 'three/addons/libs/lil-gui.module.min.js'; 

        // --- 音频系统 (新增单击专属音效) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let isAudioStarted = false;
        let bgmElement = new Audio(); // 用户音乐播放器
        bgmElement.loop = true;

        // 监听用户上传音乐
        document.getElementById('music-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                bgmElement.src = url;
                bgmElement.volume = 0.5; // 默认音量
                bgmElement.play().then(() => {
                    const btn = document.getElementById('music-btn');
                    btn.innerText = "正在播放: " + (file.name.length > 8 ? file.name.substring(0,8)+"..." : file.name);
                    btn.classList.add('playing');
                }).catch(err => console.error("播放失败", err));
            }
        });

        // 播放合成音效 (悬停/单击/爆炸 三种)
        function playSound(type) {
            if(!isAudioStarted) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'hover') {
                // 高频微弱的哔声
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'click-zoom') {
                // 单击放大：柔和的中频上升音，更轻量
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.2);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'explode') {
                // 爆炸白噪/低频扫描
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(10, now + 0.5);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
                osc.start(now);
                osc.stop(now + 0.8);
            }
        }
        
        // 启动系统 (解锁 AudioContext)
        window.startExperience = function() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (!isAudioStarted) {
                isAudioStarted = true;
                const overlay = document.getElementById('loading-overlay');
                overlay.style.opacity = 0;
                setTimeout(() => overlay.style.display = 'none', 1000);
            }
        };

        // --- 核心变量 (新增触摸/双指缩放相关状态) ---
        let scene, camera, renderer, composer, bloomPass;
        let clock = new THREE.Clock();
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        // 触摸相关核心变量
        let touches = {}; // 存储触摸点 {0: {x,y}, 1: {x,y}}
        let lastTouchDistance = 0; // 上一帧双指距离，用于计算缩放
        let isSingleTouch = true; // 是否为单指触摸（区分单指拖动和双指缩放）
        
        let isMouseDown = false; // 鼠标/单指是否按下
        let lastMouseX = 0, lastMouseY = 0; // 上一帧鼠标/触摸位置
        let clickDownTime = 0; // 按下时间戳（区分单击/长按）
        const CLICK_THRESHOLD = 200; // 单击判定阈值(ms)，超过则为长按
        const TOUCH_MOVE_THRESHOLD = 10; // 触摸移动阈值，避免单击误判
        let touchMoveDistance = 0; // 触摸移动距离，用于判定是否为单击

        // 单击放大状态
        let zoomingCard = null; // 正在放大的卡片
        let zoomEndTime = 0; // 放大停留结束时间戳
        const ZOOM_STAY_TIME = 2000; // 放大停留时间(ms)，可自定义
        let isZoomPaused = false; // 是否处于放大停留状态（禁止拖动/重复单击）

        // 全局冷却时间 (时间戳)
        let cooldownEndTime = 0;
        let lastHoverObj = null; 

        let camTarget = { lat: 0, lon: 0, radius: 85 }; 
        let camCurrent = { lat: 0, lon: 0, radius: 100 };

        const popupGroup = new THREE.Group();
        const popups = []; 
        let particles = null; 
        let particleTexture = null;
        
        // 爆炸系统数组
        let explosions = [];

        // --- 文案库 ---
        let MESSAGES = [
            "今天辛苦了", "早点休息", "多喝热水", "好梦成真", 
            "别熬夜了", "保持好心情", "未来可期", "记得吃饭", 
            "抱抱自己", "永远开心", "万事胜意", "你很棒",
            "记得微笑", "允许休息", "慢慢来", "好事发生",
            "生活明朗", "万物可爱", "平安喜乐", "自在如风",
            "保持热爱", "奔赴山海", "来日方长", "一切顺利",
            "天天开心", "元气满满", "能量加满", "我想你了",
            "见信如晤", "岁岁平安", "光芒万丈", "随遇而安",
            "不负韶华", "只争朝夕", "初心未改", "未来已来",
            "心之所向", "素履以往", "生如夏花", "静待花开"
        ];
        // 副标题
        const SUB_MESSAGES = [
            "不用刻意迎合，你本来的样子就很美。",
            "与其向往，不如出发，路在脚下。",
            "允许自己做自己，允许别人做别人。",
            "慢慢理解世界，慢慢更新自己。",
            "每一种创伤，都是一种成熟。",
            "你逆光而来，配得上这世间所有的好。",
            "生活原本沉闷，但跑起来就有风。",
            "保持热爱，奔赴下一场山海。",
            "关关难过关关过，前路漫漫亦灿灿。",
            "在这路遥马急的人间，你我平安就好。",
            "世界上所有的惊喜和好运，都是你累积的人品和善良。",
            "愿你无论哪个年龄，都能保持那份赤忱与勇敢。",
            "生活里的不期而遇，都是努力后的惊喜。",
            "无论今天多么浑浊，明天依旧会如约而至。",
            "虽然辛苦，我还是会选择那种滚烫的人生。",
            "所谓无底深渊，下去，也是前程万里。",
            "你所见即是我，好与坏我都不反驳。",
            "把不忙不闲的工作做得出色，把不咸不淡的生活过得精彩。",
            "愿你精致到老，眼里长着太阳，笑里全是坦荡。",
            "凡是过往，皆为序章；凡是未来，皆有可期。"
        ];
        
        // --- 样式库 ---
        const PALETTES = [
            { bg: ['#24243e', '#302b63', '#0f0c29'], border: '#a18cd1', particle: [0xa18cd1, 0x302b63] }, 
            { bg: ['#134e5e', '#71b280'], border: '#71b280', particle: [0x71b280, 0x134e5e] }, 
            { bg: ['#ff9966', '#ff5e62'], border: '#ff9966', particle: [0xff9966, 0xff5e62] }, 
            { bg: ['#000428', '#004e92'], border: '#004e92', particle: [0x004e92, 0x00c6ff] }, 
            { bg: ['#833ab4', '#fd1d1d', '#fcb045'], border: '#fcb045', particle: [0xfcb045, 0xfd1d1d] }, 
            { bg: ['#2C3E50', '#4CA1AF'], border: '#4CA1AF', particle: [0x4CA1AF, 0xBDC3C7] }, 
            { bg: ['#4568DC', '#B06AB3'], border: '#B06AB3', particle: [0xB06AB3, 0x4568DC] } 
        ];

        // --- 全局参数 (移动端微调灵敏度，更顺手) ---
        const params = {
            // 星云生成
            count: 350, 
            radiusBase: 40, 
            radiusVariation: 15, 
            
            // 动态
            cardBaseSize: 1.0, 
            scale: 1.1,        
            floatSpeed: 0.4,
            rotationSpeed: 0.012, 

            // 交互
            zoomScaleRatio: 0.8,  // 替换原固定zoomScale：放大宽度占屏幕宽度的比例(0-1)，手机端推荐0.8-0.9
            dissolveTime: 3.0,   
            cooldownTime: 2000,  
            
            // 视觉
            bloomStrength: 0.7,
            bloomRadius: 0.8,
            bloomThreshold: 0.15,
            // 鼠标/触摸控制灵敏度（移动端已适配，此值通用）
            mouseSensitivity: 0.005,
            wheelSensitivity: 5,
            // 双指缩放灵敏度
            touchZoomSensitivity: 0.08
        };

        // --- 文本编辑器逻辑 ---
        window.openEditor = function() {
            const modal = document.getElementById('editor-modal');
            const textarea = document.getElementById('text-input');
            textarea.value = MESSAGES.join('\n'); // 载入当前文本
            modal.style.display = 'flex';
        }
        window.closeEditor = function() {
            document.getElementById('editor-modal').style.display = 'none';
        }
        window.saveText = function() {
            const textarea = document.getElementById('text-input');
            const raw = textarea.value;
            // 过滤空行
            const newLines = raw.split('\n').map(t => t.trim()).filter(t => t.length > 0);
            if(newLines.length > 0) {
                MESSAGES = newLines;
                initPopups(); // 重建星云
                window.closeEditor();
            } else {
                alert("内容不能为空");
            }
        }

        // --- B键 沉浸模式逻辑 + 移动端返回键兼容 ---
        window.addEventListener('keydown', (e) => {
            if(e.key.toLowerCase() === 'b') {
                document.body.classList.toggle('clean-mode');
            }
        });
        // 移动端浏览器返回键兼容，防止误退
        window.addEventListener('popstate', () => {
            if(document.body.classList.contains('clean-mode')) {
                document.body.classList.remove('clean-mode');
                history.pushState({}, '');
            }
        });
        history.pushState({}, '');

        // --- 计算双指之间的距离 ---
        function getTouchDistance(t0, t1) {
            const dx = t0.x - t1.x;
            const dy = t0.y - t1.y;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // --- 鼠标+触摸 控制逻辑（核心适配：单指拖动、双指缩放、触摸单击/长按）---
        function initMouseControl() {
            // === 桌面端鼠标事件 ===
            // 鼠标按下
            document.addEventListener('mousedown', (e) => {
                if (e.button === 0 && !isZoomPaused && !isCoolingDown()) {
                    isMouseDown = true;
                    clickDownTime = Date.now();
                    lastMouseX = e.clientX;
                    lastMouseY = e.clientY;
                    document.body.classList.add('dragging');
                    e.preventDefault();
                }
            });
            // 鼠标移动
            document.addEventListener('mousemove', (e) => {
                if (!isMouseDown || isZoomPaused) return;
                const deltaX = e.clientX - lastMouseX;
                const deltaY = e.clientY - lastMouseY;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                camTarget.lon += deltaX * params.mouseSensitivity;
                camTarget.lat -= deltaY * params.mouseSensitivity;
                camTarget.lat = THREE.MathUtils.clamp(camTarget.lat, -Math.PI/3, Math.PI/3);
                e.preventDefault();
            });
            // 鼠标松开
            document.addEventListener('mouseup', (e) => {
                if (e.button === 0) {
                    handlePointerUp(e.clientX, e.clientY);
                }
            });
            // 鼠标离开
            document.addEventListener('mouseleave', () => {
                handlePointerUp(0, 0);
            });
            // 鼠标滚轮
            document.addEventListener('wheel', (e) => {
                if (isZoomPaused) return;
                const delta = e.deltaY * 0.1;
                camTarget.radius += delta * params.wheelSensitivity;
                camTarget.radius = THREE.MathUtils.clamp(camTarget.radius, 25, 160);
                e.preventDefault();
            });

            // === 移动端触摸事件 核心适配 ===
            // 触摸开始：单指/双指识别
            document.addEventListener('touchstart', (e) => {
                e.preventDefault(); // 禁止默认行为
                if (isZoomPaused || isCoolingDown()) return;

                // 存储所有触摸点
                for (let i = 0; i < e.touches.length; i++) {
                    const touch = e.touches[i];
                    touches[touch.identifier] = { x: touch.clientX, y: touch.clientY };
                }

                // 双指触摸：开启缩放模式，关闭拖动
                if (e.touches.length === 2) {
                    isSingleTouch = false;
                    lastTouchDistance = getTouchDistance(touches[e.touches[0].identifier], touches[e.touches[1].identifier]);
                } 
                // 单指触摸：开启拖动模式，记录初始状态
                else if (e.touches.length === 1) {
                    isSingleTouch = true;
                    isMouseDown = true;
                    clickDownTime = Date.now();
                    touchMoveDistance = 0; // 重置触摸移动距离
                    const touch = e.touches[0];
                    lastMouseX = touch.clientX;
                    lastMouseY = touch.clientY;
                    document.body.classList.add('dragging');
                    // 触摸悬停模拟：添加hover样式
                    const btn = document.elementFromPoint(touch.clientX, touch.clientY);
                    if (btn && btn.classList.contains('hud-btn')) btn.classList.add('touch-hover');
                }
            }, { passive: false }); // 必须设置passive:false，否则e.preventDefault()无效

            // 触摸移动：单指拖动 / 双指缩放
            document.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (isZoomPaused || isCoolingDown()) return;

                // 更新触摸点
                for (let i = 0; i < e.touches.length; i++) {
                    const touch = e.touches[i];
                    touches[touch.identifier] = { x: touch.clientX, y: touch.clientY };
                }

                // 双指缩放
                if (e.touches.length === 2 && !isSingleTouch) {
                    const currentDistance = getTouchDistance(touches[e.touches[0].identifier], touches[e.touches[1].identifier]);
                    if (lastTouchDistance > 0) {
                        const delta = (currentDistance - lastTouchDistance) * params.touchZoomSensitivity;
                        camTarget.radius -= delta;
                        camTarget.radius = THREE.MathUtils.clamp(camTarget.radius, 25, 160);
                    }
                    lastTouchDistance = currentDistance;
                } 
                // 单指拖动
                else if (e.touches.length === 1 && isSingleTouch && isMouseDown) {
                    const touch = e.touches[0];
                    const deltaX = touch.clientX - lastMouseX;
                    const deltaY = touch.clientY - lastMouseY;
                    // 累计触摸移动距离，用于判定是否为单击
                    touchMoveDistance += Math.sqrt(deltaX*deltaX + deltaY*deltaY);
                    lastMouseX = touch.clientX;
                    lastMouseY = touch.clientY;
                    camTarget.lon += deltaX * params.mouseSensitivity;
                    camTarget.lat -= deltaY * params.mouseSensitivity;
                    camTarget.lat = THREE.MathUtils.clamp(camTarget.lat, -Math.PI/3, Math.PI/3);
                }

                // 更新射线检测的鼠标位置（兼容触摸）
                if (e.touches.length >= 1) {
                    const touch = e.touches[0];
                    mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;
                }
            }, { passive: false });

            // 触摸结束：重置状态，判定单击/长按
            document.addEventListener('touchend', (e) => {
                e.preventDefault();
                // 移除触摸点
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    delete touches[touch.identifier];
                    // 移除hover样式
                    const btn = document.elementFromPoint(touch.clientX, touch.clientY);
                    if (btn && btn.classList.contains('hud-btn')) btn.classList.remove('touch-hover');
                }

                // 最后一个触摸点离开，处理松开逻辑
                if (e.touches.length === 0) {
                    const lastTouch = e.changedTouches[0];
                    handlePointerUp(lastTouch.clientX, lastTouch.clientY);
                    isSingleTouch = true;
                    lastTouchDistance = 0;
                } 
                // 双指变单指，重置单指状态
                else if (e.touches.length === 1) {
                    isSingleTouch = true;
                    const touch = e.touches[0];
                    lastMouseX = touch.clientX;
                    lastMouseY = touch.clientY;
                }
            }, { passive: false });

            // 触摸取消（如来电、弹窗）
            document.addEventListener('touchcancel', (e) => {
                e.preventDefault();
                touches = {};
                handlePointerUp(0, 0);
                isSingleTouch = true;
                lastTouchDistance = 0;
                // 移除所有hover样式
                document.querySelectorAll('.hud-btn.touch-hover').forEach(btn => btn.classList.remove('touch-hover'));
            }, { passive: false });

            // 鼠标/触摸 移动时更新射线检测位置（通用）
            document.addEventListener('mousemove', (e) => {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            });
        }

        // --- 鼠标/触摸 松开通用处理函数（核心：统一判定单击/长按）---
        function handlePointerUp(clientX, clientY) {
            isMouseDown = false;
            document.body.classList.remove('dragging');
            
            // 仅在 非放大/非冷却 状态下判定单击
            if (!isZoomPaused && !isCoolingDown()) {
                const clickDuration = Date.now() - clickDownTime;
                // 单击判定：按下时间 < 阈值 + 移动距离 < 阈值（防拖动误判）
                if (clickDuration < CLICK_THRESHOLD && touchMoveDistance < TOUCH_MOVE_THRESHOLD) {
                    // 转换坐标为three.js的鼠标坐标
                    mouse.x = (clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(clientY / window.innerHeight) * 2 + 1;
                    // 射线检测点击的卡片
                    raycaster.setFromCamera(mouse, camera);
                    const activePopups = popups.filter(p => !p.userData.isDissolved && !p.userData.isDissolving);
                    const intersects = raycaster.intersectObjects(activePopups);
                    if (intersects.length > 0) {
                        const clickCard = intersects[0].object;
                        triggerCardZoom(clickCard); // 触发单击放大
                    }
                }
            }
            // 重置触摸相关状态
            touchMoveDistance = 0;
        }

        // --- 单击卡片放大核心函数 ---
        function triggerCardZoom(card) {
            if (zoomingCard || isZoomPaused) return; // 已有放大卡片，禁止重复单击
            zoomingCard = card;
            isZoomPaused = true;
            zoomEndTime = Date.now() + ZOOM_STAY_TIME; // 设定停留结束时间
            document.body.classList.add('zoom-pause'); // 切换光标样式
            playSound('click-zoom'); // 播放单击专属音效

            // 初始化卡片放大的详细纹理（如果没有的话）
            const data = card.userData;
            if (!data.detailedTex) {
                data.detailedTex = createTexture(data.text, data.subText, data.paletteId);
            }
        }

        // --- 冷却状态判定工具函数 ---
        function isCoolingDown() {
            return Date.now() < cooldownEndTime;
        }

        // --- 新增：计算屏幕适配的放大比例（核心适配手机端）---
        function getScreenAdaptedZoomScale() {
            // 基于屏幕宽度计算放大比例，单位：three.js世界单位
            // 手机端窄屏：放大后卡片宽度占屏幕80%；桌面端宽屏：限制最大宽度，避免过大
            const screenWidth = window.innerWidth;
            // 基础比例：每100px屏幕宽度对应1个three.js世界单位，可根据需要微调
            const baseUnitPer100px = 1;
            let zoomScale = (screenWidth / 100) * baseUnitPer100px * params.zoomScaleRatio;
            // 限制最大/最小放大比例，避免极端情况
            zoomScale = THREE.MathUtils.clamp(zoomScale, 4, 10);
            return zoomScale;
        }

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x02020a, 0.006); 

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ 
                antialias: true, 
                alpha: true, 
                powerPreference: "high-performance",
                preserveDrawingBuffer: true // 移动端保存绘制缓冲区，防止闪屏
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // 限制像素比，移动端性能优化
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.setClearColor(0x02020a, 1); // 设定清屏颜色，适配移动端透明问题
            document.body.appendChild(renderer.domElement);

            const renderScene = new RenderPass(scene, camera);
            
            bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = params.bloomThreshold;
            bloomPass.strength = params.bloomStrength;
            bloomPass.radius = params.bloomRadius;

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);
            // 移动端适配EffectComposer像素比
            composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            particleTexture = createParticleTexture();
            initParticles();
            initPopups();
            scene.add(popupGroup);
            initGUI();
            initMouseControl(); // 初始化鼠标+触摸控制

            window.addEventListener('resize', onWindowResize);
            // 移动端窗口大小变化（如旋转屏幕）立即适配
            window.addEventListener('orientationchange', onWindowResize);
        }

        // --- 兼容绘制 ---
        function drawRoundRect(ctx, x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        function createTexture(text, subText, paletteIndex) {
            const canvas = document.createElement('canvas');
            // 移动端纹理大小适配，避免过大导致性能问题
            const w = Math.min(512, window.innerWidth * 0.8);
            const h = subText ? (w * 350) / 512 : (w * 256) / 512; 
            canvas.width = w; canvas.height = h; 
            
            const ctx = canvas.getContext('2d');
            const style = PALETTES[paletteIndex % PALETTES.length];

            const grad = ctx.createLinearGradient(0, 0, w, h);
            if(style.bg.length === 3) {
                grad.addColorStop(0, style.bg[0]);
                grad.addColorStop(0.5, style.bg[1]);
                grad.addColorStop(1, style.bg[2]);
            } else {
                grad.addColorStop(0, style.bg[0]);
                grad.addColorStop(1, style.bg[1]);
            }
            
            const r = Math.min(24, w * 0.05); // 圆角自适应纹理大小
            drawRoundRect(ctx, 0, 0, w, h, r);
            ctx.fillStyle = grad;
            ctx.globalAlpha = 0.8; 
            ctx.fill();

            ctx.globalAlpha = 1.0;
            ctx.lineWidth = Math.min(6, w * 0.012); // 边框宽度自适应
            ctx.strokeStyle = "rgba(255,255,255,0.1)";
            ctx.stroke();
            ctx.lineWidth = Math.min(2, w * 0.004);
            ctx.strokeStyle = style.border; 
            ctx.globalAlpha = 0.5;
            ctx.stroke();
            ctx.globalAlpha = 1.0;

            // 小图标自适应
            const dotSize = Math.min(8, w * 0.02);
            ctx.fillStyle = style.bg[0]; ctx.beginPath(); ctx.arc(w*0.08, w*0.08, dotSize, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = style.border; ctx.beginPath(); ctx.arc(w*0.14, w*0.08, dotSize, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = style.bg[style.bg.length-1]; ctx.beginPath(); ctx.arc(w*0.20, w*0.08, dotSize, 0, Math.PI*2); ctx.fill();

            ctx.shadowColor = "rgba(0,0,0,0.6)";
            ctx.shadowBlur = Math.min(12, w * 0.024);
            ctx.shadowOffsetY = Math.min(5, w * 0.01);
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            const mainTextY = subText ? h/2 - w*0.07 : h/2 + w*0.01; 
            // 主文字大小自适应
            ctx.font = `bold ${Math.min(72, w*0.14)}px 'Microsoft YaHei'`;
            ctx.fillStyle = "#ffffff";
            ctx.fillText(text, w/2, mainTextY);

            if (subText) {
                // 副文字大小自适应
                ctx.font = `normal ${Math.min(26, w*0.05)}px 'Microsoft YaHei'`;
                ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
                ctx.shadowBlur = 0; 
                
                const maxWidth = w - w*0.14;
                let words = subText.split('');
                let line = '';
                let y = mainTextY + w*0.15;
                
                for(let n = 0; n < words.length; n++) {
                    let testLine = line + words[n];
                    let metrics = ctx.measureText(testLine);
                    if (metrics.width > maxWidth && n > 0) {
                        ctx.fillText(line, w/2, y);
                        line = words[n];
                        y += w*0.075;
                    } else {
                        line = testLine;
                    }
                }
                ctx.fillText(line, w/2, y);
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        // --- 核心：艺术化布局 ---
        function initPopups() {
            popupGroup.clear();
            popups.length = 0;

            const geometry = new THREE.PlaneGeometry(3.6, 1.8); 
            const phiStep = Math.PI * (3 - Math.sqrt(5)); 

            for(let i=0; i<params.count; i++) {
                
                let y_base = 1 - (i / (params.count - 1)) * 2;
                y_base = Math.max(-1, Math.min(1, y_base)); 

                const radius_at_y = Math.sqrt(1 - y_base * y_base);
                const theta = phiStep * i;

                let x = Math.cos(theta) * radius_at_y;
                let y = y_base;
                let z = Math.sin(theta) * radius_at_y;

                const phi = Math.acos(y_base);
                const wave = Math.sin(phi * 5 + theta * 3) * 0.25 + Math.cos(theta * 2) * 0.15;
                
                const finalRadius = params.radiusBase + 
                                   (Math.random() - 0.5) * params.radiusVariation + 
                                   (wave * 12); 

                const pos = new THREE.Vector3(x, y, z).normalize().multiplyScalar(finalRadius);

                const msg = MESSAGES[Math.floor(Math.random() * MESSAGES.length)];
                const subMsg = SUB_MESSAGES[Math.floor(Math.random() * SUB_MESSAGES.length)];
                const paletteId = Math.floor(Math.random() * PALETTES.length);

                const tex = createTexture(msg, null, paletteId);

                const material = new THREE.MeshBasicMaterial({
                    map: tex,
                    transparent: true,
                    side: THREE.DoubleSide,
                    depthWrite: false,
                    color: 0xffffff 
                });

                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.copy(pos);
                
                mesh.userData = {
                    basePos: pos.clone(),
                    randomScaleFactor: (0.8 + Math.random()*0.4), 
                    phase: Math.random() * Math.PI * 2,
                    speed: 0.3 + Math.random() * 0.7, 
                    text: msg,      
                    subText: subMsg,
                    paletteId: paletteId, 
                    originalTex: tex,     
                    detailedTex: null,    
                    isReadingMode: false,
                    holdStartTime: 0,
                    isDissolving: false,
                    isDissolved: false
                };
                
                mesh.scale.setScalar(0);
                popupGroup.add(mesh);
                popups.push(mesh);
            }
        }

        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.2, 'rgba(240, 240, 255, 0.8)');
            gradient.addColorStop(0.5, 'rgba(128, 128, 255, 0.2)');
            gradient.addColorStop(1, 'rgba(0, 0, 64, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 128, 128);
            return new THREE.CanvasTexture(canvas);
        }

        function initParticles() {
            const particleCount = 3500; 
            const geo = new THREE.BufferGeometry();
            const pos = [];
            const colors = []; 
            const sizes = []; 
            const colorObj = new THREE.Color();

            for(let i=0; i<particleCount; i++) {
                const r = (params.radiusBase + 20) * Math.pow(Math.random(), 0.4);
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const spiralMod = Math.sin(theta * 3) * 10;

                pos.push(
                    (r + spiralMod) * Math.sin(phi) * Math.cos(theta),
                    (r + spiralMod) * Math.sin(phi) * Math.sin(theta),
                    (r + spiralMod) * Math.cos(phi)
                );

                const palette = PALETTES[Math.floor(Math.random() * PALETTES.length)];
                const colorHex = palette.particle[Math.floor(Math.random() * palette.particle.length)];
                colorObj.setHex(colorHex);
                colorObj.multiplyScalar(0.8 + Math.random() * 0.4);
                colors.push(colorObj.r, colorObj.g, colorObj.b);
                sizes.push(0.5 + Math.random() * 1.5);
            }

            geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geo.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

            const mat = new THREE.PointsMaterial({
                size: 1.0, map: particleTexture, vertexColors: true, 
                transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, 
                depthWrite: false, sizeAttenuation: true 
            });

            particles = new THREE.Points(geo, mat);
            scene.add(particles);
        }

        function createExplosion(position, paletteId) {
            playSound('explode'); // 播放音效
            const particleCount = 800;
            const geo = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            const sizes = [];
            const velocities = [];
            const palette = PALETTES[paletteId % PALETTES.length];
            const colorObj = new THREE.Color();

            for (let i = 0; i < particleCount; i++) {
                const spreadX = (Math.random() - 0.5) * 15;
                const spreadY = (Math.random() - 0.5) * 10;
                const spreadZ = (Math.random() - 0.5) * 2;

                positions.push(position.x + spreadX, position.y + spreadY, position.z + spreadZ);

                const colorHex = palette.particle[Math.floor(Math.random() * palette.particle.length)];
                colorObj.setHex(colorHex);
                colorObj.multiplyScalar(1.5); 
                colors.push(colorObj.r, colorObj.g, colorObj.b);

                sizes.push(0.5 + Math.random() * 1.2);
                const angle = Math.random() * Math.PI * 2;
                const speed = 0.2 + Math.random() * 0.8;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed + 0.3; 
                const vz = (Math.random() - 0.5) * speed;
                velocities.push(vx, vy, vz);
            }

            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geo.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

            const mat = new THREE.PointsMaterial({
                size: 1.0, map: particleTexture, vertexColors: true,
                transparent: true, opacity: 1.0, blending: THREE.AdditiveBlending,
                depthWrite: false, sizeAttenuation: true
            });

            const points = new THREE.Points(geo, mat);
            scene.add(points);
            explosions.push({ mesh: points, velocities: velocities, age: 0, maxAge: 3.0 });
        }

        function updateExplosions(dt) {
            for (let i = explosions.length - 1; i >= 0; i--) {
                const exp = explosions[i];
                exp.age += dt;

                if (exp.age >= exp.maxAge) {
                    scene.remove(exp.mesh);
                    exp.mesh.geometry.dispose();
                    exp.mesh.material.dispose();
                    explosions.splice(i, 1);
                    continue;
                }

                const positions = exp.mesh.geometry.attributes.position.array;
                const count = positions.length / 3;

                exp.mesh.material.opacity = 1.0 - (exp.age / exp.maxAge);
                exp.mesh.material.size = Math.max(0, 1.0 * (1 - exp.age / exp.maxAge));

                for (let j = 0; j < count; j++) {
                    const idx = j * 3;
                    const drag = 0.95;
                    exp.velocities[idx] *= drag;
                    exp.velocities[idx+1] *= drag;
                    exp.velocities[idx+2] *= drag;

                    positions[idx] += exp.velocities[idx];
                    positions[idx+1] += exp.velocities[idx+1];
                    positions[idx+2] += exp.velocities[idx+2];
                }
                exp.mesh.geometry.attributes.position.needsUpdate = true;
            }
        }

        function initGUI() {
            
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            const dt = clock.getDelta(); 
            const currentTimeMs = Date.now();

            if (bloomPass) {
                bloomPass.strength = params.bloomStrength;
                bloomPass.radius = params.bloomRadius;
                bloomPass.threshold = params.bloomThreshold;
            }

            const barContainer = document.getElementById('dissolve-bar-container');
            const bar = document.getElementById('dissolve-bar');

            let coolingDown = isCoolingDown();
            // 检测放大停留是否结束
            if (isZoomPaused && currentTimeMs >= zoomEndTime) {
                isZoomPaused = false;
                zoomingCard = null;
                document.body.classList.remove('zoom-pause');
            }

            // 非放大/非拖动/非冷却时，保留自动旋转
            if (!isMouseDown && !isZoomPaused && !coolingDown) {
                camTarget.lon = time * 0.05;
                camTarget.lat = Math.sin(time * 0.1) * 0.2;
            }

            // 平滑更新摄像头位置（放大停留时禁止视角变化）
            if (!isZoomPaused) {
                camCurrent.lon += (camTarget.lon - camCurrent.lon) * 0.05;
                camCurrent.lat += (camTarget.lat - camCurrent.lat) * 0.05;
                camCurrent.radius += (camTarget.radius - camCurrent.radius) * 0.1; 
            }
            
            // 计算摄像头三维坐标，增加NaN容错，移动端更稳定
            let cx = camCurrent.radius * Math.cos(camCurrent.lat) * Math.sin(camCurrent.lon);
            let cy = camCurrent.radius * Math.sin(camCurrent.lat);
            let cz = camCurrent.radius * Math.cos(camCurrent.lat) * Math.cos(camCurrent.lon);
            if (isNaN(cx) || isNaN(cy) || isNaN(cz)) { cx = 0; cy = 0; cz = 85; } 

            camera.position.set(cx, cy, cz);
            camera.lookAt(0, 0, 0);

            // 射线检测：检测鼠标/触摸悬停的卡片（冷却/放大时关闭）
            let currentHover = null;
            if (!coolingDown && !isZoomPaused) {
                raycaster.setFromCamera(mouse, camera);
                const activePopups = popups.filter(p => !p.userData.isDissolved && !p.userData.isDissolving);
                const intersects = raycaster.intersectObjects(activePopups);
                if (intersects.length > 0) {
                    currentHover = intersects[0].object;
                }
            }

            // 音效触发：悬停变化（冷却/放大时关闭）
            if (currentHover && currentHover !== lastHoverObj && !coolingDown && !isZoomPaused) {
                playSound('hover');
            }
            lastHoverObj = currentHover;
            
            let isReadingAny = false;

            popups.forEach(mesh => {
                const data = mesh.userData;
                
                // 卡片爆炸溶解逻辑
                if (data.isDissolved) {
                    if (mesh.material.opacity <= 0.05) {
                         data.isDissolving = false;
                         data.isDissolved = false;
                         data.isReadingMode = false;
                         data.holdStartTime = 0;
                         mesh.scale.setScalar(0); 
                         mesh.material.opacity = 0;
                         mesh.material.map = data.originalTex;
                         mesh.material.color.setHex(0xffffff); 
                    } else { mesh.material.opacity *= 0.9; }
                    return; 
                }
                if (data.isDissolving) {
                    const expansionSpeed = 1.05; 
                    mesh.scale.multiplyScalar(expansionSpeed);
                    mesh.material.opacity -= 0.05;
                    mesh.material.color.lerp(new THREE.Color(0x000000), 0.1); 
                    if (mesh.material.opacity <= 0) { data.isDissolved = true; }
                    return;
                }

                // --- 核心：单击放大逻辑（优先级高于长按/悬停）---
                if (zoomingCard === mesh && isZoomPaused) {
                    // 强制切换到详细纹理
                    if (mesh.material.map !== data.detailedTex) {
                        mesh.material.map = data.detailedTex;
                    }
                    // 关键修改：使用屏幕适配的动态放大比例，替代固定zoomScale
                    const targetScale = getScreenAdaptedZoomScale();
                    const ratioFix = 350/256;
                    mesh.scale.lerp(new THREE.Vector3(targetScale, targetScale * ratioFix, 1), 0.2);
                    mesh.material.opacity = 1.0; // 强制不透明
                    
                    // 卡片固定到镜头前方，跟随视角，移动端微调距离避免贴脸
                    const camDir = new THREE.Vector3();
                    camera.getWorldDirection(camDir);
                    // 动态调整卡片与镜头的距离：屏幕越小，距离越近，避免手机上看不清
                    const camDistance = THREE.MathUtils.clamp(window.innerWidth / 50, 20, 30);
                    const targetWorldPos = camera.position.clone().add(camDir.multiplyScalar(camDistance));
                    const targetLocalPos = mesh.parent.worldToLocal(targetWorldPos.clone());
                    mesh.position.lerp(targetLocalPos, 0.2);
                    mesh.quaternion.slerp(camera.quaternion, 0.2);
                    return; // 跳过后续的长按/漂浮逻辑
                }

                // 原有长按爆炸逻辑（仅在非放大/非冷却时生效）
                const isTarget = (currentHover === mesh);
                const shouldRead = isTarget && isMouseDown && !coolingDown && !isZoomPaused;

                let targetScale = data.randomScaleFactor * params.cardBaseSize; 
                let targetScaleY = targetScale; 
                let targetOpacity = 0.85;
                
                if (shouldRead) {
                    data.isReadingMode = true; 
                    isReadingAny = true;
                    if (data.holdStartTime === 0) data.holdStartTime = time;
                    const holdDuration = time - data.holdStartTime;
                    const dissolveTime = params.dissolveTime; 
                    
                    barContainer.style.opacity = 1;
                    const progress = Math.min(1, holdDuration / dissolveTime);
                    bar.style.width = (progress * 100) + '%';
                    
                    let shakeOffset = new THREE.Vector3(0,0,0);
                    let shakeRotationZ = 0; 
                    let sizeGlitch = 0;     
                    const warningTime = dissolveTime * 0.66;
                    
                    if (holdDuration > warningTime && holdDuration < dissolveTime) {
                         const instability = (holdDuration - warningTime) / (dissolveTime - warningTime);
                         const shakeAmp = 0.8 * Math.pow(instability, 3); 
                         shakeOffset.set((Math.random() - 0.5) * shakeAmp, (Math.random() - 0.5) * shakeAmp, (Math.random() - 0.5) * shakeAmp);
                         shakeRotationZ = (Math.random() - 0.5) * 0.3 * Math.pow(instability, 2);
                         sizeGlitch = Math.sin(time * 50) * 0.2 * instability; 
                         if (Math.sin(time * 30) > 0) { mesh.material.color.setHex(0xaaffff); } else { mesh.material.color.setHex(0xffffff); }
                         targetOpacity = 1.0;
                    } else if (holdDuration < warningTime) {
                        mesh.material.color.setHex(0xffffff); 
                    }

                    if (holdDuration >= dissolveTime) {
                        data.isDissolving = true;
                        cooldownEndTime = Date.now() + params.cooldownTime;
                        barContainer.style.opacity = 0;
                        const worldPos = new THREE.Vector3();
                        mesh.getWorldPosition(worldPos);
                        createExplosion(worldPos, data.paletteId);
                        document.body.style.transform = "scale(1.02)";
                        setTimeout(() => document.body.style.transform = "scale(1)", 100);
                        return; 
                    }

                    targetScale = getScreenAdaptedZoomScale() + sizeGlitch; 
                    if (!data.detailedTex) data.detailedTex = createTexture(data.text, data.subText, data.paletteId);
                    if (mesh.material.map !== data.detailedTex) mesh.material.map = data.detailedTex;
                    const ratioFix = (350/256); 
                    targetScaleY = targetScale * ratioFix;

                    const camDir = new THREE.Vector3();
                    camera.getWorldDirection(camDir);
                    // 长按放大也适配屏幕距离
                    const camDistance = THREE.MathUtils.clamp(window.innerWidth / 50, 20, 30);
                    const targetWorldPos = camera.position.clone().add(camDir.multiplyScalar(camDistance));
                    targetWorldPos.add(shakeOffset);
                    const targetLocalPos = mesh.parent.worldToLocal(targetWorldPos.clone());
                    mesh.position.lerp(targetLocalPos, 0.15);
                    const targetWorldQuat = camera.quaternion.clone();
                    const shakeQuat = new THREE.Quaternion();
                    shakeQuat.setFromAxisAngle(new THREE.Vector3(0, 0, 1), shakeRotationZ);
                    targetWorldQuat.multiply(shakeQuat);
                    const parentWorldQuat = new THREE.Quaternion();
                    mesh.parent.getWorldQuaternion(parentWorldQuat);
                    const targetLocalQuat = parentWorldQuat.invert().multiply(targetWorldQuat);
                    mesh.quaternion.slerp(targetLocalQuat, 0.15);

                } else {
                    // 恢复卡片漂浮逻辑
                    data.isReadingMode = false; 
                    data.holdStartTime = 0; 
                    if (mesh.material.map !== data.originalTex) mesh.material.map = data.originalTex;
                    mesh.material.color.setHex(0xffffff); 
                    targetScaleY = targetScale; 
                    const floatX = Math.cos(time * data.speed + data.phase) * 0.3 * params.floatSpeed;
                    const floatY = Math.sin(time * data.speed + data.phase) * 0.5 * params.floatSpeed;
                    const floatZ = Math.sin(time * data.speed * 0.8 + data.phase) * 0.3 * params.floatSpeed;
                    const targetBasePos = data.basePos.clone().add(new THREE.Vector3(floatX, floatY, floatZ));
                    mesh.position.lerp(targetBasePos, 0.1);
                    mesh.lookAt(camera.position);
                }
                
                mesh.scale.lerp(new THREE.Vector3(targetScale, targetScaleY, 1), 0.1);
                mesh.material.opacity += (targetOpacity - mesh.material.opacity) * 0.1;
            });

            if (!isReadingAny) {
                barContainer.style.opacity = 0;
                bar.style.width = '0%';
            }

            if(particles) {
                particles.rotation.y = time * 0.02;
                particles.rotation.x = Math.sin(time * 0.01) * 0.1;
            }
            
            // 放大停留时，暂停星云整体旋转
            if (!isZoomPaused) {
                popupGroup.rotation.y = -time * params.rotationSpeed;
            }
            updateExplosions(0.016); 
            composer.render();
        }

        // --- 响应式调整核心函数（适配窗口/屏幕旋转）---
        function onWindowResize() {
            // 更新相机宽高比
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            // 更新渲染器/合成器尺寸，适配视口
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            // 更新辉光效果的分辨率
            bloomPass.setSize(window.innerWidth, window.innerHeight);
            // 屏幕尺寸变化时，若有放大的卡片，重新计算适配比例
            if (zoomingCard && isZoomPaused) {
                const targetScale = getScreenAdaptedZoomScale();
                const ratioFix = 350/256;
                zoomingCard.scale.lerp(new THREE.Vector3(targetScale, targetScale * ratioFix, 1), 0.5);
            }
        }

        init();
        animate();

    </script>
</body>
